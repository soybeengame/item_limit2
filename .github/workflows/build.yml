name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: JDK 17 をセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Maven でビルド
        run: mvn -B package --file pom.xml

      - name: ビルド成果物(jar)をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ItemLimit-jar
          path: target/*.jar
          if-no-files-found: error
