# ==========================================
# ItemLimit 設定ファイル
# ==========================================

# 何tickごとにオンライン全プレイヤーの所持数を再チェックするか（保険用）
# 通常はインベントリ操作のたびに即座にチェックされるため、この値は
# 大きめ（例: 20 = 1秒）でも問題ありません。
check-interval-ticks: 20

# アイテムごとの「インベントリ内合計」の最大所持数を設定します。
# キーはMaterial名（大文字、スペースはアンダースコア）、値は最大所持数です。
# ここに設定されていないアイテムは制限されません。
#
# 例:
#   DIAMOND: 64
#   NETHERITE_INGOT: 16
limits:
  DIAMOND: 64
  NETHERITE_INGOT: 16
  EMERALD: 128
